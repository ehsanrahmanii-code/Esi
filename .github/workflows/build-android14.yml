name: Build TITAN AI — Android 14 FINAL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Esi
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Python 3.13
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Extract TITAN source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _titan
          unzip -q TITAN_V36_ANDROID_RELEASE.zip -d _titan
          PROJECT="$(find _titan -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          test -n "$PROJECT"
          PROJECT_DIR="$(dirname "$PROJECT")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"
          find "$PROJECT_DIR/app/src/main" -maxdepth 3 -type f | sort | head -200

      - name: Android 14 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          MANIFEST="app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"

          # Android 14: do not request deprecated broad external-storage permissions.
          sed -i '/android.permission.READ_EXTERNAL_STORAGE/d' "$MANIFEST" || true
          sed -i '/android.permission.WRITE_EXTERNAL_STORAGE/d' "$MANIFEST" || true
          sed -i '/requestLegacyExternalStorage/d' "$MANIFEST" || true

          # Internet is required for live market data.
          grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"

          # Permit HTTPS/normal network operation without any storage permission.
          if grep -q '<application ' "$MANIFEST"; then
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST" || true
          fi

          # Make the launcher app resilient: initialize a private/app-external TITAN data area.
          PKG_DIR="app/src/main/java/com/titan/ai/final"
          mkdir -p "$PKG_DIR"
          cat > "$PKG_DIR/TitanApplication.java" <<'JAVA'
package com.titan.ai.final;

import android.app.Application;
import android.content.Context;
import java.io.File;

public final class TitanApplication extends Application {
    @Override public void onCreate() {
        super.onCreate();
        try {
            File root = new File(getExternalFilesDir(null), "AI TAITAN AI");
            if (!root.exists()) root.mkdirs();
            new File(root, "data").mkdirs();
            new File(root, "cache").mkdirs();
            new File(root, "memory").mkdirs();
            new File(root, "models").mkdirs();
            new File(root, "logs").mkdirs();
            new File(root, "settings").mkdirs();
            new File(root, "secrets").mkdirs();
        } catch (Throwable ignored) {
            // Never prevent the main Activity from starting because storage initialization failed.
        }
    }
}
JAVA

          # Register the application class without requesting legacy storage access.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/AndroidManifest.xml")
          s=p.read_text(encoding="utf-8")
          if 'android:name="com.titan.ai.final.TitanApplication"' not in s:
              s=s.replace('<application ', '<application android:name="com.titan.ai.final.TitanApplication" ', 1)
          p.write_text(s, encoding="utf-8")
          PY

          # Keep Chaquopy on the exact Python executable installed by Actions.
          PYEXE="$(python3 -c 'import sys; print(sys.executable)')"
          grep -RIl '/opt/pyvenv/bin/python3' . --include='*.gradle' --include='*.gradle.kts' | xargs -r sed -i "s#/opt/pyvenv/bin/python3#$PYEXE#g"

          # Target Android 14+ while retaining the existing TITAN code.
          find . -name 'build.gradle' -o -name 'build.gradle.kts' | xargs -r sed -i \
            -e 's/compileSdkVersion[[:space:]]*[0-9][0-9]*/compileSdkVersion 35/g' \
            -e 's/targetSdkVersion[[:space:]]*[0-9][0-9]*/targetSdkVersion 35/g' \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/compileSdk = 35/g' \
            -e 's/targetSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/targetSdk = 35/g'

          chmod +x ./gradlew
          ./gradlew --version

      - name: Clean and assemble release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-AI-Android-14-FINAL
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 90
